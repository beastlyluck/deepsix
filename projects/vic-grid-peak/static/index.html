<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>VIC grid peak</title>
  <style>
    body { margin: 0; background: #111; color: #e8e2d6; font-family: "IBM Plex Mono", ui-monospace, monospace; }
    header { padding: 20px 24px 8px; border-bottom: 1px solid #333; }
    h1 { margin: 0; font-size: 18px; letter-spacing: 0.08em; }
    #meta { color: #9a9184; font-size: 12px; margin-top: 6px; }
    #chart { width: 100%; height: 280px; display: block; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { text-align: left; padding: 8px 24px; border-bottom: 1px solid #2a2a2a; }
    .hot { color: #ff8a80; }
  </style>
</head>
<body>
  <header>
    <h1>VIC1 desk</h1>
    <div id="meta">load main.py first</div>
  </header>
  <svg id="chart" viewBox="0 0 960 280"></svg>
  <table>
    <thead><tr><th>day</th><th>hour</th><th>price</th><th>demand</th><th>note</th></tr></thead>
    <tbody id="log"></tbody>
  </table>
  <script>
    function line(svg, xs, ys, color, dash) {
      const min = Math.min(...ys), max = Math.max(...ys);
      const n = xs.length;
      let d = "";
      ys.forEach((v, i) => {
        const x = 40 + (i / (n - 1)) * 900;
        const y = 20 + (1 - (v - min) / (max - min || 1)) * 230;
        d += (i ? "L" : "M") + x.toFixed(1) + "," + y.toFixed(1);
      });
      const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
      p.setAttribute("d", d);
      p.setAttribute("fill", "none");
      p.setAttribute("stroke", color);
      p.setAttribute("stroke-width", "1.4");
      if (dash) p.setAttribute("stroke-dasharray", "5 4");
      svg.appendChild(p);
    }
    Promise.all([fetch("/api/series").then(r => r.json()), fetch("/api/events").then(r => r.json())])
      .then(([s, e]) => {
        if (s.error) { document.getElementById("meta").textContent = s.error; return; }
        const svg = document.getElementById("chart");
        line(svg, s.t, s.demand, "#e8e2d6");
        line(svg, s.t, s.q90, "#8d8678", true);
        document.getElementById("meta").textContent =
          "q90 pinball " + e.pinball_q90 + " · coverage " + e.q90_coverage + " · spike rate " + e.spike_rate;
        document.getElementById("log").innerHTML = (e.events || []).map(ev =>
          `<tr class="hot"><td>${ev.day}</td><td>${ev.hour}</td><td>${ev.price}</td><td>${ev.demand}</td><td>${ev.note}</td></tr>`
        ).join("");
      });
  </script>
</body>
</html>
